name: Pubblica post programmati

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo prova, senza pubblicare? (true = prova, false = pubblica davvero)'
        default: 'true'
      solo_id:
        description: 'Pubblica subito solo il post con questo id (lascia vuoto per il funzionamento normale)'
        default: ''

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pubblica i post arrivati alla loro ora
        run: node src/publish.js
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ONLY_ID: ${{ github.event.inputs.solo_id || '' }}
      - name: Salva lo stato delle pubblicazioni
        if: always()
        run: |
          git config user.name "scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet || (git commit -m "Aggiorna stato pubblicazioni" && git push)
